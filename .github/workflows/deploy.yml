name: CI/CD

on:
  push:
    branches: [dev, main]
  workflow_dispatch: {}

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.v.outputs.sha }}
      backend_image: ${{ steps.v.outputs.backend_image }}
      frontend_image: ${{ steps.v.outputs.frontend_image }}
      env: ${{ steps.v.outputs.env }}
      namespace: ${{ steps.v.outputs.namespace }}
      values_file: ${{ steps.v.outputs.values_file }}
      api_url: ${{ steps.v.outputs.api_url }}
    steps:
      - id: v
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "backend_image=${REGISTRY}/${owner}/fitconnect-backend" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${REGISTRY}/${owner}/fitconnect-frontend" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "env=prod" >> "$GITHUB_OUTPUT"
            echo "namespace=fitconnect-prod" >> "$GITHUB_OUTPUT"
            echo "values_file=values-prod.yaml" >> "$GITHUB_OUTPUT"
            echo "api_url=https://fitconnect-moetaz.duckdns.org" >> "$GITHUB_OUTPUT"
          else
            echo "env=dev" >> "$GITHUB_OUTPUT"
            echo "namespace=fitconnect-dev" >> "$GITHUB_OUTPUT"
            echo "values_file=values-dev.yaml" >> "$GITHUB_OUTPUT"
            echo "api_url=https://dev.fitconnect-moetaz.duckdns.org" >> "$GITHUB_OUTPUT"
          fi

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - working-directory: fitconnect-backend
        env:
          JWT_SECRET: test-secret-0123456789012345678901234567890123
        run: mvn -B test

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: fitconnect-frontend/package-lock.json
      - working-directory: fitconnect-frontend
        run: npm ci
      - working-directory: fitconnect-frontend
        run: npm run lint
        continue-on-error: true
      - working-directory: fitconnect-frontend
        run: npm run build

  build-backend:
    needs: [setup, test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./fitconnect-backend
          push: true
          tags: |
            ${{ needs.setup.outputs.backend_image }}:${{ needs.setup.outputs.sha }}
            ${{ needs.setup.outputs.backend_image }}:${{ needs.setup.outputs.env }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    needs: [setup, test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./fitconnect-frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ needs.setup.outputs.api_url }}
            VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          tags: ${{ needs.setup.outputs.frontend_image }}:${{ needs.setup.outputs.sha }}-${{ needs.setup.outputs.env }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [setup, build-backend, build-frontend]
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "k8s/fitconnect/**,k8s/values-dev.yaml,k8s/values-prod.yaml,k8s/cluster-issuer.yaml,k8s/letsencrypt-issuer.yaml"
          target: "~/fitconnect"
          overwrite: true
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            export PATH=$PATH:/usr/local/bin
            export KUBECONFIG=$HOME/.kube/config
            cd ~/fitconnect
            helm upgrade --install fitconnect-${{ needs.setup.outputs.env }} ./k8s/fitconnect \
              --namespace ${{ needs.setup.outputs.namespace }} --create-namespace \
              -f k8s/${{ needs.setup.outputs.values_file }} \
              -f k8s/values-secret-${{ needs.setup.outputs.env }}.yaml \
              --set backend.image.repository=${{ needs.setup.outputs.backend_image }} \
              --set backend.image.tag=${{ needs.setup.outputs.sha }} \
              --set frontend.image.repository=${{ needs.setup.outputs.frontend_image }} \
              --set frontend.image.tag=${{ needs.setup.outputs.sha }}-${{ needs.setup.outputs.env }} \
              --wait --timeout 5m
            kubectl -n ${{ needs.setup.outputs.namespace }} rollout status deploy/fitconnect-${{ needs.setup.outputs.env }}-backend --timeout=180s
            kubectl -n ${{ needs.setup.outputs.namespace }} rollout status deploy/fitconnect-${{ needs.setup.outputs.env }}-frontend --timeout=180s
