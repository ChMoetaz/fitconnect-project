name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.v.outputs.sha }}
      backend_image: ${{ steps.v.outputs.backend_image }}
      frontend_image: ${{ steps.v.outputs.frontend_image }}
    steps:
      - id: v
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "backend_image=${REGISTRY}/${owner}/fitconnect-backend" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${REGISTRY}/${owner}/fitconnect-frontend" >> "$GITHUB_OUTPUT"

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - working-directory: fitconnect-backend
        env:
          JWT_SECRET: test-secret-0123456789012345678901234567890123
        run: mvn -B test

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: fitconnect-frontend/package-lock.json
      - working-directory: fitconnect-frontend
        run: npm ci
      - working-directory: fitconnect-frontend
        run: npm run lint
        continue-on-error: true
      - working-directory: fitconnect-frontend
        run: npm run build

  build-backend:
    needs: [setup, test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./fitconnect-backend
          push: true
          tags: |
            ${{ needs.setup.outputs.backend_image }}:${{ needs.setup.outputs.sha }}
            ${{ needs.setup.outputs.backend_image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    needs: [setup, test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - env: dev
            api_url: https://dev.158.158.75.139.nip.io
          - env: prod
            api_url: https://158.158.75.139.nip.io
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./fitconnect-frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ matrix.api_url }}
            VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          tags: ${{ needs.setup.outputs.frontend_image }}:${{ needs.setup.outputs.sha }}-${{ matrix.env }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    needs: [setup, build-backend, build-frontend]
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "k8s/fitconnect/**,k8s/values-dev.yaml,k8s/values-prod.yaml,k8s/cluster-issuer.yaml"
          target: "~/fitconnect"
          overwrite: true
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            export PATH=$PATH:/usr/local/bin
            export KUBECONFIG=$HOME/.kube/config
            cd ~/fitconnect
            helm upgrade --install fitconnect-dev ./k8s/fitconnect \
              --namespace fitconnect-dev --create-namespace \
              -f k8s/values-dev.yaml -f k8s/values-secret-dev.yaml \
              --set backend.image.repository=${{ needs.setup.outputs.backend_image }} \
              --set backend.image.tag=${{ needs.setup.outputs.sha }} \
              --set frontend.image.repository=${{ needs.setup.outputs.frontend_image }} \
              --set frontend.image.tag=${{ needs.setup.outputs.sha }}-dev \
              --wait --timeout 5m
            kubectl -n fitconnect-dev rollout status deploy/fitconnect-dev-backend --timeout=180s
            kubectl -n fitconnect-dev rollout status deploy/fitconnect-dev-frontend --timeout=180s

  deploy-prod:
    needs: [setup, deploy-dev]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "k8s/fitconnect/**,k8s/values-dev.yaml,k8s/values-prod.yaml,k8s/cluster-issuer.yaml"
          target: "~/fitconnect"
          overwrite: true
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            export PATH=$PATH:/usr/local/bin
            export KUBECONFIG=$HOME/.kube/config
            cd ~/fitconnect
            helm upgrade --install fitconnect-prod ./k8s/fitconnect \
              --namespace fitconnect-prod --create-namespace \
              -f k8s/values-prod.yaml -f k8s/values-secret-prod.yaml \
              --set backend.image.repository=${{ needs.setup.outputs.backend_image }} \
              --set backend.image.tag=${{ needs.setup.outputs.sha }} \
              --set frontend.image.repository=${{ needs.setup.outputs.frontend_image }} \
              --set frontend.image.tag=${{ needs.setup.outputs.sha }}-prod \
              --wait --timeout 5m
            kubectl -n fitconnect-prod rollout status deploy/fitconnect-prod-backend --timeout=180s
            kubectl -n fitconnect-prod rollout status deploy/fitconnect-prod-frontend --timeout=180s
