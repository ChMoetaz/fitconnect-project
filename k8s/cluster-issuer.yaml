apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: fitconnect-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: fitconnect-ca
  secretName: fitconnect-ca-key-pair
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: fitconnect-ca
spec:
  ca:
    secretName: fitconnect-ca-key-pair
